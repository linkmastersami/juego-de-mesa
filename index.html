<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Juego de mesa</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--felt:#2b2833;--panel:#38343f;--ink:#f3eee6;--mute:#a9a2b3;--gold:#f2c14e;--heart:#ff5d73;--g:#2fae5a;--r:#e0393e;--b:#2f6fe0;--w:#f4f1ea;--k:#17171b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 40%,#3a3544,var(--felt));color:var(--ink);font-family:Fredoka,system-ui,sans-serif;overflow:hidden;user-select:none}
button{font-family:inherit}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding:10px;max-width:520px;margin:0 auto}
.bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tab{border:0;border-radius:14px;background:var(--panel);color:var(--ink);font:700 1.05rem Fredoka,sans-serif;padding:11px}
.tab.on{background:var(--gold);color:#2b2208}
#cross{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,var(--cw));grid-template-rows:repeat(3,auto);justify-content:center;align-content:center;gap:6px;--cw:min(29vw,calc((100dvh - 310px)*5/21))}
.cell{position:relative;aspect-ratio:5/7;border-radius:10px}
.cell.empty{border:2px dashed #fff3}
.pg{position:absolute;right:-4px;bottom:-4px;min-width:30px;height:30px;border-radius:15px;background:var(--gold);color:#2b2208;display:grid;place-items:center;font-weight:700;padding:0 6px;box-shadow:0 2px 6px #0008;z-index:2}
.card{position:relative;width:100%;height:100%;border-radius:8px;background:#4a4555;overflow:hidden;display:grid;place-items:center;font-size:.75rem;color:var(--mute)}
.card::before{content:attr(data-id);position:absolute}
.card img{position:relative;width:100%;height:100%;object-fit:cover}
.lbl{font-size:.75rem;color:var(--mute);margin:0 4px}
.strip{display:flex;gap:6px;overflow-x:auto;height:11dvh;min-height:70px;align-items:stretch}
.strip>div{aspect-ratio:5/7;flex:none}
.decks{display:flex;gap:6px;justify-content:space-between;height:12dvh;min-height:78px}
.decks>div{aspect-ratio:5/7;flex:none}
.deck{border-radius:8px;background:repeating-linear-gradient(45deg,#4d3f6b,#4d3f6b 8px,#5a4a7c 8px,#5a4a7c 16px);border:2px solid #fff3;display:grid;place-items:center;text-align:center;font-size:.72rem;line-height:1.1;padding:2px}
.deck b{font-size:1.3rem;display:block}
.off{filter:grayscale(1) brightness(.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:88dvh;overflow-y:auto;background:#2f2b37;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px #000a;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s;z-index:5}
.sheet.on{transform:none}
.sheet h3{margin:0 0 10px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid>div{aspect-ratio:5/7}
.empt{color:var(--mute);text-align:center;padding:20px}
.top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:var(--panel);border-radius:18px;padding:8px 10px;text-align:center}
.panel small{color:var(--mute);font-size:.8rem;display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.num{font-size:2.4rem;font-weight:700;line-height:1;min-width:2ch}
.heart{color:var(--heart)}
.step{width:46px;height:46px;border-radius:50%;border:0;background:#4a4555;color:var(--ink);font:700 1.7rem Fredoka,sans-serif}
.step:active{background:#5b5568;transform:scale(.94)}
.piles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;text-align:center;font-size:.85rem;color:var(--mute)}
.piles>div>div{height:20dvh;aspect-ratio:5/7;margin:4px auto}
.table{height:36dvh;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:center;
--s:min(30vw,15dvh,150px);perspective:700px;background:radial-gradient(90% 70% at 50% 50%,#332f3c,#26232d);border-radius:24px;box-shadow:inset 0 0 40px #0006;overflow:hidden}
.slot{width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d}
.fly,.cube{position:absolute;inset:0;transform-style:preserve-3d}
.shadow{position:absolute;left:8%;right:8%;bottom:-6%;height:16%;border-radius:50%;background:#000;filter:blur(8px);opacity:.45}
.face{position:absolute;inset:0;border-radius:12%;border:2px solid #0003;box-shadow:inset 0 0 18px #0004,inset 0 6px 10px #fff3}
.face::after{content:"";position:absolute;inset:22%;border-radius:22%;border:3px solid #0002}
.f0{transform:translateZ(calc(var(--s)/2))}
.f1{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.f2{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.f3{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.f4{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.f5{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.verde{background:var(--g)}.rojo{background:var(--r)}.azul{background:var(--b)}
.blanco{background:var(--w)}.negro{background:var(--k)}.negro::after{border-color:#fff2}
.res{display:flex;justify-content:center;gap:8px;height:22px;margin-top:8px}
.res i{width:18px;height:18px;border-radius:50%;border:2px solid #fff6}
.hits{text-align:center;font-weight:700;font-size:1.2rem;height:28px;color:var(--gold)}
#roll{width:100%;border:0;border-radius:22px;background:var(--gold);color:#2b2208;font:700 1.7rem Fredoka,sans-serif;padding:16px;box-shadow:0 6px 0 #b98d22}
#roll:active{transform:translateY(5px);box-shadow:0 1px 0 #b98d22}
#roll:disabled{opacity:.6}
.foot{display:flex;justify-content:center;margin-top:6px}
#reset{background:#4a2630;border:0;border-radius:14px;color:#ffb3bd;font:700 1rem Fredoka,sans-serif;padding:12px 18px;width:100%}
#ov{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:9;padding:16px;overflow-y:auto}
#ov.on{display:grid}
.box{background:#2f2b37;border-radius:20px;padding:14px;width:min(100%,360px);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.box .card.big{width:min(58vw,300px);height:auto;aspect-ratio:5/7}
.box .grid{width:100%;max-height:55dvh;overflow-y:auto}
.pks>.pk{aspect-ratio:auto;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:10px}.pk .card{width:100%;aspect-ratio:5/7}.pk small{font-size:.7rem;color:var(--mute)}.pk.sel{box-shadow:0 0 0 4px var(--gold);transform:scale(1.05)}
.btns{display:flex;flex-direction:column;gap:8px;width:100%}
.btns button{border:0;border-radius:14px;background:#4a4555;color:var(--ink);font:700 1.05rem Fredoka,sans-serif;padding:12px}
.btns button:disabled{opacity:.35}
.btns button.verde,.btns button.rojo,.btns button.azul{color:#fff}
.btns .ghost{background:none;color:var(--mute);font-weight:500}
.pv{font-weight:700;color:var(--gold);font-size:1.2rem}
@keyframes bl{50%{box-shadow:0 0 0 4px var(--gold),0 0 18px var(--gold)}}
.blink{animation:bl 1s infinite}
#bt{position:fixed;inset:0;background:#1d1a24;z-index:4;display:none;flex-direction:column;gap:10px;padding:12px;max-width:520px;margin:0 auto;overflow-y:auto}
#bt.on{display:flex}
.vs{display:grid;grid-template-columns:1fr auto 1.5fr;gap:8px;align-items:center}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mute);font-size:.8rem}
.vs .cell{width:30vw;max-width:130px}
.vsx{font-size:1.8rem;color:var(--gold)}
.orb{width:84px;height:84px;border-radius:50%;background:var(--gold);color:#2b2208;display:grid;place-items:center;font:700 2.4rem Fredoka,sans-serif}
.orb.p{background:#6fb1ff}
.pl{display:flex;gap:6px;width:100%}
.pl>div{flex:1;aspect-ratio:5/7;border:2px dashed #fff3;border-radius:8px;display:grid;place-items:center;font-size:.7rem}
.dim{opacity:.45}
.row3{display:flex;gap:8px;width:100%}.b3{flex:1;aspect-ratio:5/7;transition:.4s}.b3.sel{box-shadow:0 0 0 4px var(--gold);transform:scale(1.07)}.b3 .deck{height:100%;font-size:2rem}
#apart{position:fixed;right:6px;top:64px;display:flex;flex-direction:column;gap:4px;width:9vw;max-width:48px;z-index:1}#apart>div{aspect-ratio:5/7}
</style>
</head>
<body>
<div class="app">
  <div class="bar"><button class="tab" id="tTurn">Turno</button><button class="tab" data-sh="hand" id="tHand">Mano</button><button class="tab" data-sh="st" id="tSt">Estado</button></div>
  <div id="cross"></div>
  <div><span class="lbl">En mesa</span><div class="strip" id="mesa"></div></div>
  <div class="decks">
    <div data-pj="m19" id="m19"></div><div data-hab="1" id="m20"></div>
    <div class="deck" data-dk="M" id="dM"></div><div class="deck" data-dk="K" id="dK"></div><div class="deck" data-dk="C" id="dC"></div>
  </div>
</div>

<div class="sheet" id="sh-hand"><h3>Mano</h3><div class="grid" id="hand"></div></div>

<div class="sheet" id="sh-st">
  <h3>Estado del jugador</h3>
  <div class="top">
    <div class="panel"><small>Turno</small><div class="row"><button class="step" data-k="turn" data-d="-1" aria-label="Turno menos">−</button><span class="num" id="turn">1</span><button class="step" data-k="turn" data-d="1" aria-label="Turno más">+</button></div></div>
    <div class="panel"><small>Corazones</small><div class="row"><button class="step" data-k="hp" data-d="-1" aria-label="Corazón menos">−</button><span class="num"><span class="heart">♥</span><span id="hp">10</span></span><button class="step" data-k="hp" data-d="1" aria-label="Corazón más">+</button></div></div>
  </div>
  <div class="piles">
    <div data-pile="disc">Descartes<div class="deck" id="pDisc"></div></div>
    <div data-pile="comp">Completados<div id="pComp"></div></div>
  </div>
  <div class="table" id="table"></div>
  <div class="res" id="res"></div>
  <div class="hits" id="hits"></div>
  <button id="roll">Lanzar dados</button>
  <div class="foot"><button id="reset">Reiniciar toda la partida</button></div>
</div>
<div id="apart"></div>
<div id="bt"></div>
<div id="ov"></div>

<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const rng=(p,a,b)=>Array.from({length:b-a+1},(_,i)=>p+pad(a+i));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const card=(id,c='')=>`<div class="card ${c}" data-id="${id}"><img src="cartas/${id}.png" alt="${id}" onerror="this.remove()"></div>`;
const fresh0=()=>({turn:1,hp:10,dM:shuf(rng('m',1,18)),dK:shuf(rng('k',1,6)),dC:shuf(rng('c',1,57)),hand:[],mesa:[],disc:[],comp:[],cross:[{id:'j01',p:10},null,null,null,null],final:0,hab:0,apart:[]});
const fresh=()=>{const s=fresh0();s.hand=s.dM.splice(-8);for(let k=0;k<3;k++)s.disc.push(s.dC.pop());for(let i=1;i<=4;i++)s.cross[i]={id:s.dC.pop(),p:0};return s};
let S=fresh();
try{const v=JSON.parse(localStorage.getItem('mesa-juego')||'null');if(v&&v.cross)S=v}catch(e){}

/* ---------- pintar ---------- */
function render(){
  S.apart=S.apart||[];$('#apart').innerHTML=S.apart.map(id=>`<div data-ap="${id}">${card(id)}</div>`).join('');
  checkEnd();
  if(!S.over&&(S.hp<=0||(S.cross[0]&&S.cross[0].id==='j01'&&S.cross[0].p<=0)))whenFree(endGame);
  $('#cross').innerHTML=[null,1,null,2,0,3,null,4,null].map(i=>{
    if(i===null)return'<div></div>';const c=S.cross[i];
    return c?`<div class="cell${PICK&&(i||S.final&&unl().length)&&CH[c.id]&&!blk(c)?' blink':''}" data-s="${i}">${card(c.id)}<b class="pg">${c.p}</b></div>`:'<div class="cell empty"></div>'}).join('');
  $('#mesa').innerHTML=S.mesa.map((id,i)=>`<div data-m="${i}">${card(id)}</div>`).join('');
  $('#hand').innerHTML=S.hand.length?S.hand.map((id,i)=>`<div data-h="${i}"${id==='m08'||id==='m14'?' class="blink"':''}>${card(id)}</div>`).join(''):'';
  if(!S.hand.length)$('#hand').innerHTML='<div class="empt" style="grid-column:1/-1;aspect-ratio:auto">Sin cartas en la mano</div>';
  $('#tHand').textContent='Mano ('+S.hand.length+')';$('#tHand').classList.toggle('blink',S.hand.some(x=>x==='m08'||x==='m14'));
  $('#m19').innerHTML=card('m19');$('#m20').innerHTML=card('m20',S.hab?'':'off');
  $('#dM').innerHTML=`<span>Personaje<b>${S.dM.length}</b></span>`;
  $('#dK').innerHTML=`<span>Agotamiento<b>${S.dK.length}</b></span>`;
  $('#dC').innerHTML=`<span>Calabozo<b>${S.dC.length}</b></span>`;
  $('#pDisc').innerHTML=`<span><b>${S.disc.length}</b></span>`;
  $('#pComp').innerHTML=S.comp.length?card(S.comp[S.comp.length-1]):'<div class="card" style="opacity:.4"></div>';
  $('#turn').textContent=S.turn;$('#hp').textContent=S.hp;
  try{localStorage.setItem('mesa-juego',JSON.stringify(S))}catch(e){}
}

/* ---------- ventana emergente ---------- */
let OV=[];
function ov(id,btns,extra=''){
  OV=btns;
  const pk=btns.map((b,i)=>b[4]?`<div data-b="${i}" class="pk ${b[3]||''}">${card(b[4])}${b[5]?`<small>${b[5]}</small>`:''}</div>`:'').join('');
  $('#ov').innerHTML=`<div class="box">${id?card(id,'big'):''}${extra}${pk?`<div class="grid pks">${pk}</div>`:''}<div class="btns">${btns.map((b,i)=>b[4]?'':`<button data-b="${i}" class="${b[3]||''}" ${b[2]?'disabled':''}>${b[0]}</button>`).join('')}<button data-b="x" class="ghost">Cerrar</button></div></div>`;
  $('#ov').classList.add('on');
}
const close=()=>$('#ov').classList.remove('on');
const msg=t=>{ov(null,[],`<p>${t}</p>`);return 1};
const gridOf=(ids,attr)=>`<div class="grid">${ids.map((id,i)=>`<div ${attr}="${i}">${card(id)}</div>`).join('')}</div>`;

/* ---------- cartas del tablero ---------- */
function openCross(i){
  const c=S.cross[i],t=c.id[0],id=c.id;
  if(t==='g'&&+id.slice(1)>4)return ov(id,[]);
  if(/^c(07|08|50|52)$/.test(id))return evt(i);
  const locked=t==='c'&&S.cross.some(y=>y&&/^c1[123]$/.test(y.id))&&!/^c1[123]$/.test(id);
  const b=[['+ Progreso',()=>{c.p++;render();openCross(i);return 1},'',locked?'':''],['− Progreso',()=>{c.p=Math.max(0,c.p-1);render();openCross(i);return 1}]];
  if(locked)b[0]=[`+ Progreso (bloqueado por c11–c13)`,()=>1,true];
  if(t==='c')b.push(['Descartar',()=>dropCh(i),/^c1[456]$/.test(id)],['Completar',()=>{S.comp.push(id);S.cross[i]=null}]);
  if(t==='g'){const f=()=>{S.cross[i]={id:'g'+pad(+id.slice(1)+4),p:0}};if(id!=='g04')b.push(['Completar (voltear)',f]);if(id!=='g03')b.push(['Descartar (voltear)',f])}
  ov(id,b,`<div class="pv">Progreso: ${c.p}</div>`);
}
function openHand(i){const id=S.hand[i];const ex=[];
  if(id==='m08')ex.push(['Descartar al inicio del turno: +1 progreso por fuego a un desafío',()=>{S.hand.splice(i,1);S.disc.push(id);pickCh('Elige el desafío',x=>{x.p+=fireDisc()},()=>close());return 1}]);
  if(id==='m14')ex.push(['Descartar al inicio del turno: buscar en el mazo',()=>{S.hand.splice(i,1);S.disc.push(id);SHF=1;ov(null,[],'<p>Toca una carta</p>'+gridOf(S.dM,'data-sc'));return 1}]);
  ov(id,[...ex,['Jugar en mesa',()=>{S.mesa.push(id);S.hand.splice(i,1)}],['Descartar',()=>discCard(id)],['Regresar al mazo',()=>{S.dM.push(id);S.hand.splice(i,1)}]]);
}
function openMesa(i){const id=S.mesa[i],b=[];
  if(id[0]==='m')b.push(['Descartar',()=>{S.disc.push(id);S.mesa.splice(i,1)}]);
  b.push(['Regresar al mazo',()=>{(id[0]==='k'?S.dK:S.dM).push(id);S.mesa.splice(i,1)}]);
  ov(id,b);
}

/* ---------- fase final ---------- */
const whenFree=f=>{if($('#ov').classList.contains('on')||$('#bt').classList.contains('on'))setTimeout(()=>whenFree(f),700);else f()};
function checkEnd(){if(S.final||S.dC.length||![1,2,3,4].some(i=>!S.cross[i]))return;startFinal()}
function startFinal(){const j=['j02','j03','j04'][Math.floor(Math.random()*3)];
  S.cross.slice(1).forEach(x=>{if(x&&x[0]!=='g'&&x.id[0]==='c')S.disc.push(x.id)});
  S.cross=[{id:j,p:S.cross[0].p},...[1,2,3,4].map(n=>({id:'g0'+n,p:0}))];S.final=1;
  if((S.apart||[]).includes('c52')&&S.cross[0].p>=13){S.over=1;whenFree(()=>ov(null,[['Nueva partida',()=>newGame()]],'<h2>¡Victoria!</h2><p>Llegaste al fondo del mazo con el jefe final en 13 o más de progreso.</p>'));return}
  whenFree(()=>intro(j))}
function intro(j){const all=['j02','j03','j04'],r3=st=>`<div class="row3">${all.map(x=>`<div class="b3 ${x===j&&st?'sel':''}">${st>1?card(x):'<div class="deck">?</div>'}</div>`).join('')}</div>`,sw=st=>{const r=$('.row3');if(r)r.outerHTML=r3(st)};
  ov(null,[['Continuar',()=>{}]],'<p>¡Llega el jefe final!</p>'+r3(0));setTimeout(()=>sw(1),1300);setTimeout(()=>sw(2),2600)}
function endGame(){S.over=1;ov(null,[['Nueva partida',()=>newGame()]],`<h2>Derrota</h2><p>${S.hp<=0?'Te quedaste sin corazones.':'El jefe final se quedó sin progreso.'}</p>`)}
const newGame=()=>{S=fresh();PICK=0;B=null;$('#bt').classList.remove('on');$('#tTurn').textContent='Turno';hits.textContent='';render()};

/* ---------- mazos ---------- */
function openDeck(k){
  if(k==='M')ov(null,[
    ['Robar una carta',()=>{if(!S.dM.length)return msg('El mazo está vacío');S.hand.push(S.dM.pop())}],
    ['Barajar el mazo',()=>{shuf(S.dM)}],
    ['Buscar en el mazo',()=>{if(!S.dM.length)return msg('El mazo está vacío');ov(null,[],`<p>Toca una carta</p>`+gridOf(S.dM,'data-sc'));return 1}]
  ],`<p>Mazo de personaje: ${S.dM.length}</p>`);
  if(k==='K')ov(null,[
    ['Barajar el mazo',()=>{shuf(S.dK)}],
    ['Robar una carta',()=>{if(!S.dK.length)return msg('El mazo está vacío');S.mesa.push(S.dK.pop());kShow(S.mesa[S.mesa.length-1]);return 1}]
  ],`<p>Mazo de agotamiento: ${S.dK.length}</p>`);
  if(k==='C'){const e=[1,2,3,4].find(i=>!S.cross[i]);
    ov(null,[
      ['Barajar el mazo',()=>{shuf(S.dC)}],
      ['Descartar una carta del mazo',()=>{if(!S.dC.length)return msg('El mazo está vacío');S.disc.push(S.dC.pop());checkEnd()}],
      ['Robar una carta',()=>{const d=S.dC.pop();S.cross[e]={id:d,p:S.apart.includes('c53')&&TY[d]&&TY[d]!=='C'?2:0};entry(e);checkEnd()},!(e&&S.dC.length&&!S.final)]
    ],`<p>Mazo de calabozo: ${S.dC.length}</p>`);}
}

/* ---------- pilas ---------- */
function openPile(p){
  if(p==='disc')ov(null,[['Regresar la última al mazo',()=>{if(!S.disc.length)return msg('No hay cartas');const id=S.disc.pop();(id[0]==='c'?S.dC:S.dM).push(id)},!S.disc.length]],`<p>Descartes (boca abajo): ${S.disc.length}</p>`);
  else ov(null,[],S.comp.length?`<p>Completados: ${S.comp.length}</p>`+gridOf(S.comp,'data-cp'):'<p>Aún no hay completados</p>');
}

/* ---------- clics ---------- */
document.addEventListener('click',e=>{
  const g=k=>{const n=e.target.closest(`[data-${k}]`);return n?n.dataset[k]:null};let v;
  if((v=g('b'))!==null){if(v==='x')return close();const r=OV[+v][1]();render();if(r!==1)close();}
  else if(e.target.id==='ov')close();

  if(act==='m04'){fx.push(['m04 (elige): activar habilidad O regresar agotamiento al mazo',b=>{const km=S.mesa.filter(x=>x[0]==='k');ov(null,[['Activar la carta de habilidad (m20)',()=>{S.hab=1;render();b();return 1}],...(km.length?[['Regresar una carta de agotamiento al mazo',b2=>{ov(null,km.map(x=>[x,()=>{S.mesa.splice(S.mesa.indexOf(x),1);S.dK.push(x);shuf(S.dK);render();b();return 1},0,'',x]),'<p>Elige el agotamiento a regresar</p>');return 1}]]:[])],'<p>Elige el efecto de m04</p>');return 2}]);fx.push(['m04: barajar los descartes de personaje al mazo (sin m04)',()=>{const d=S.disc.filter(x=>x[0]==='m'&&x!=='m04');S.disc=S.disc.filter(x=>!d.includes(x));S.dM.push(...d);shuf(S.dM)}]);}
  if(act==='m13'&&S.hand.length)fx.push(['m13: devolverla a tu mano',()=>{S.disc.splice(S.disc.lastIndexOf('m13'),1);S.hand.push('m13')}]);
  if(act==='m18')B={...B,m18sh:1};
  const w0=c.p+add>=lv;
  if(S.mesa.includes('k02'))fx.push(['k02: elegir entre 1 de daño o quitar 1 de progreso al jefe final',b=>{ov(null,[['Sufrir 1 de daño',()=>{hurt(1);render();b();return 1}],['Quitar 1 al jefe final',()=>{S.cross[0].p=Math.max(0,S.cross[0].p-1);render();b();return 1}]],'<p>Efecto de k02</p>');return 2}]);
  if(act==='m02')fx.push(['m02: elegir otro desafío y añadirle 1 progreso por fuego en descartes',b=>{pickCh('Elige el otro desafío',x=>{x.p+=fireDisc()},b,c);return 2}]);
  if(act==='m07')fx.push(['m07: descartar cartas de tu mano y robar igual número',b=>{discDraw(b);return 2}]);
  if(act==='m10'&&S.hand.length)fx.push(['m10: poner una carta de tu mano encima del mazo',b=>{ov(null,S.hand.map(x=>[x,()=>{S.hand.splice(S.hand.indexOf(x),1);S.dM.push(x);render();b();return 1},0,'',x]),'<p>Elige la carta</p>');return 2}]);
  if(act==='m15'&&!w0)fx.push(['m15: descartar el desafío sin sufrir penalización',()=>dropCh(S.cross.indexOf(c))]);
  c.p+=add;const win=c.p>=lv&&id!=='g04'&&!(id[0]==='j'&&S.cross.some(x=>x&&x.id==='g01'));
  {const L=[...(spec[id]||[[],[]])[win?0:1]];
  if(id==='c35'&&!win)L.push(dmg(B.act?sumB()-B.as.reduce((t,x)=>t+av(x),0):10));
  if(id==='c51'&&!win)L.push(hd(lv-c.p));
  if(id==='c56'&&win&&c.p>lv)L.push([`robar ${c.p-lv} carta(s) por exceso`,()=>draw(c.p-lv)]);
  const dk=dice[3].f[dice[3].face]==='negro';
  if(!win&&S.cross.some(y=>y&&/^c2[678]$/.test(y.id)))L.push(['c26-c28: descartar el desafío fallado',()=>dropCh(S.cross.indexOf(c))]);
  if(!win&&!/^c(29|3[0-2])$/.test(id)&&S.cross.some(y=>y&&/^c(29|3[0-2])$/.test(y.id))){const pen=[...(spec[id]||[[],[]])[1]];if(id==='c35')pen.push(dmg(B.act?sumB()-B.as.reduce((t,x)=>t+av(x),0):10));if(id==='c51')pen.push(hd(lv-c.p));if(pen.length)L.push(...pen.map(p=>['c29–c32: penalización extra · '+p[0],p[1]]))};
  if(!win&&id==='c36')L.push(['c36: descartar este desafío en lugar de sufrir su penalización',()=>dropCh(S.cross.indexOf(c))]);
  if(dk&&S.cross.some(y=>y&&/^c(09|10)$/.test(y.id)))L.push(['trampa: descartar 1 carta por oscuridad',b=>{pickHand(1,b);return 2}]);
  if(dk&&!win&&S.cross.some(y=>y&&y.id==='c49'))L.push(['c49: sufrir 1 de daño por oscuridad',()=>hurt(1)]);
  if(dk&&!win&&id==='j04'&&S.hand.length)L.push(['j04: descartar una carta al azar y sufrir daño igual a su valor',()=>{const x=S.hand[Math.floor(Math.random()*S.hand.length)];S.hand.splice(S.hand.indexOf(x),1);S.disc.push(x);hurt(MC[x][1])}]);
  fx.unshift(...(act==='m11'&&!win?[]:L))}
  if(win){if(id[0]==='g')S.cross[B.i]={id:'g'+pad(+id.slice(1)+4),p:0};else if(id[0]==='j')S.over=1;else if(id==='c53'){S.apart.push(id);S.cross[B.i]=null}else{S.comp.push(id);S.cross[B.i]=null}}
  S.cross.forEach(y=>{if(y&&y.id==='c39')y.p+=2});
  if(!h)S.cross.forEach((x,k)=>{if(x&&x.id==='g05')S.cross[k]={id:'g01',p:0}});
  B=null;$('#bt').classList.remove('on');$('#sh-st').classList.remove('on');render();
  res2(id,`<div class="pv">${win?(id[0]==='j'?'¡GANAS LA PARTIDA!':'¡Desafío completado!'):'No se completó'}</div><p>Cartas: +${add-h} · Dados: +${h}${win?'':` · Progreso: ${c.p}/${lv}`}</p><p>${win?'Recompensa:':'Penalización:'}</p>`,fx);
}

/* ---------- reiniciar ---------- */
let armed=0;const rs=$('#reset');
rs.onclick=()=>{if(!armed){armed=1;rs.textContent='Toca otra vez para borrar todo';setTimeout(()=>{armed=0;rs.textContent='Reiniciar toda la partida'},2500)}else{S=fresh();PICK=0;B=null;$('#bt').classList.remove('on');$('#tTurn').textContent='Turno';hits.textContent='';render();armed=0;rs.textContent='Reiniciar toda la partida'}};
render();
</script>
