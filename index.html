<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Juego de mesa</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2833">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Link Master Dungeon">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--felt:#2b2833;--panel:#38343f;--ink:#f3eee6;--mute:#a9a2b3;--gold:#f2c14e;--heart:#ff5d73;--g:#2fae5a;--r:#e0393e;--b:#2f6fe0;--w:#f4f1ea;--k:#17171b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 40%,#3a3544,var(--felt));color:var(--ink);font-family:Fredoka,system-ui,sans-serif;overflow:hidden;user-select:none}
button{font-family:inherit}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding:10px;max-width:520px;margin:0 auto}
.bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tab{border:0;border-radius:14px;background:var(--panel);color:var(--ink);font:700 1.05rem Fredoka,sans-serif;padding:11px}
.tab.on{background:var(--gold);color:#2b2208}
#cross{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,var(--cw));grid-template-rows:repeat(3,auto);justify-content:center;align-content:center;gap:6px;--cw:min(29vw,calc((100dvh - 310px)*5/21))}
.cell{position:relative;aspect-ratio:5/7;border-radius:10px}
.cell.empty{border:2px dashed #fff3}
.pg{position:absolute;right:-4px;bottom:-4px;min-width:30px;height:30px;border-radius:15px;background:var(--gold);color:#2b2208;display:grid;place-items:center;font-weight:700;padding:0 6px;box-shadow:0 2px 6px #0008;z-index:2}
.card{position:relative;width:100%;height:100%;border-radius:8px;background:#4a4555;overflow:hidden;display:grid;place-items:center;font-size:.75rem;color:var(--mute)}
.card::before{content:attr(data-id);position:absolute}
.card img{position:relative;width:100%;height:100%;object-fit:cover}
.lbl{font-size:.75rem;color:var(--mute);margin:0 4px}
.strip{display:flex;gap:6px;overflow-x:auto;height:11dvh;min-height:70px;align-items:stretch}
.strip>div{aspect-ratio:5/7;flex:none}
.decks{display:flex;gap:6px;justify-content:space-between;height:12dvh;min-height:78px}
.decks>div{aspect-ratio:5/7;flex:none}
.deck{border-radius:8px;background:repeating-linear-gradient(45deg,#4d3f6b,#4d3f6b 8px,#5a4a7c 8px,#5a4a7c 16px);border:2px solid #fff3;display:grid;place-items:center;text-align:center;font-size:.72rem;line-height:1.1;padding:2px}
.deck b{font-size:1.3rem;display:block}
.off{filter:grayscale(1) brightness(.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:88dvh;overflow-y:auto;background:#2f2b37;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px #000a;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s;z-index:5}
.sheet.on{transform:none}
.sheet h3{margin:0 0 10px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid>div{aspect-ratio:5/7}
.empt{color:var(--mute);text-align:center;padding:20px}
.top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:var(--panel);border-radius:18px;padding:8px 10px;text-align:center}
.panel small{color:var(--mute);font-size:.8rem;display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.num{font-size:2.4rem;font-weight:700;line-height:1;min-width:2ch}
.heart{color:var(--heart)}
.step{width:46px;height:46px;border-radius:50%;border:0;background:#4a4555;color:var(--ink);font:700 1.7rem Fredoka,sans-serif}
.step:active{background:#5b5568;transform:scale(.94)}
.piles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0;text-align:center;font-size:.85rem;color:var(--mute)}
.piles>div>div{height:20dvh;aspect-ratio:5/7;margin:4px auto}
#pDm{position:relative}#pDm .cn{position:absolute;right:4px;bottom:4px;background:#000b;color:#fff;border-radius:10px;padding:1px 7px;font-weight:700}
.piles>div>.fire{height:auto;aspect-ratio:auto;margin:2px auto;font:700 1.15rem Fredoka,sans-serif;color:#ffb35c}
.slot{width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d}
.fly,.cube{position:absolute;inset:0;transform-style:preserve-3d}
.shadow{position:absolute;left:8%;right:8%;bottom:-6%;height:16%;border-radius:50%;background:#000;filter:blur(8px);opacity:.45}
.face{position:absolute;inset:0;border-radius:12%;border:2px solid #0003;box-shadow:inset 0 0 18px #0004,inset 0 6px 10px #fff3}
.face::after{content:"";position:absolute;inset:22%;border-radius:22%;border:3px solid #0002}
.f0{transform:translateZ(calc(var(--s)/2))}
.f1{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.f2{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.f3{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.f4{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.f5{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.verde{background:var(--g)}.rojo{background:var(--r)}.azul{background:var(--b)}
.blanco{background:var(--w)}.negro{background:var(--k)}.negro::after{border-color:#fff2}
.foot{display:flex;justify-content:center;margin-top:6px}
#reset{background:#4a2630;border:0;border-radius:14px;color:#ffb3bd;font:700 1rem Fredoka,sans-serif;padding:12px 18px;width:100%}
#install{background:#2a3f4a;border:0;border-radius:14px;color:#a8d8ea;font:700 1rem Fredoka,sans-serif;padding:12px 18px;width:100%;display:none}
#install.on{display:block}
#fxl{position:fixed;inset:0;z-index:30;background:#000c;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;transition:opacity .25s,background .6s}
#fxl.clear{background:transparent}
#fxl.on{display:flex}#fxl.fo{opacity:0}
.fxt{font:700 1.5rem Fredoka,sans-serif;color:var(--gold);text-align:center}
.fxc .card{width:min(62vw,300px);height:auto;aspect-ratio:5/7}
.fxg{width:100%;max-width:420px}.fxg .fxc .card{width:100%}
.fxg .fxc.fin{position:relative;inset:auto}
.fin{animation:fxIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.fin.one{animation:fxIn .5s cubic-bezier(.2,.9,.3,1.2) both,fxOut .3s ease-in 1s forwards}
@keyframes fxIn{from{transform:translateY(60vh) scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fxOut{to{opacity:0;transform:scale(.85) translateY(-30px)}}
.stk{position:relative;width:min(38vw,170px);aspect-ratio:5/7}
.bk{position:absolute;inset:0;border-radius:10px;border:2px solid #fff3;background:repeating-linear-gradient(45deg,#3b3560 0 8px,#2d2850 8px 16px);box-shadow:0 8px 20px #0008;transition:opacity .3s}
.bk.gone{animation:fxGone .6s ease-in forwards}
@keyframes fxGone{to{transform:translate(var(--dx),-45vh) rotate(var(--r)) scale(.5);opacity:0;filter:brightness(2.2) saturate(0)}}
.shf{position:relative;width:min(80vw,320px);height:min(52vw,230px)}.shf .sc{position:absolute;left:50%;top:50%;border-radius:10px;border:2px solid #fff3;box-shadow:0 3px 10px #0009;background:repeating-linear-gradient(45deg,#4d3f6b,#4d3f6b 8px,#5a4a7c 8px,#5a4a7c 16px)}.shf.c .sc{filter:hue-rotate(150deg) saturate(.9)}.shf.k .sc{filter:hue-rotate(-40deg) saturate(1.1)}
.bump{animation:tick .45s}
.cnt{font:700 3rem Fredoka,sans-serif;color:#fff}.cnt.tick{animation:tick .3s}
@keyframes tick{40%{transform:scale(1.4);color:var(--gold)}}
.hw{position:relative;display:grid;place-items:center}
.hrt{position:relative;font-size:min(60vw,280px);line-height:1}
.hrt b{position:absolute;inset:0;display:grid;place-items:center;font:700 .3em Fredoka,sans-serif;color:#fff;text-shadow:0 3px 0 #0007}
.hrt.shk{animation:shk .4s}
@keyframes shk{20%{transform:translateX(-14px) scale(.9)}40%{transform:translateX(14px) scale(1.05)}60%{transform:translateX(-8px)}100%{transform:none}}
.swd{position:absolute;font-size:min(34vw,160px);opacity:0;pointer-events:none}
.swd.hit{animation:swd .5s ease-in both}
@keyframes swd{0%{transform:translate(70%,-90%) rotate(40deg);opacity:0}30%{opacity:1}65%{transform:translate(0,0) rotate(-15deg) scale(1.15);opacity:1}100%{transform:translate(-25%,25%) rotate(-35deg);opacity:0}}
.fblk{position:fixed;inset:0;z-index:24}
.flip{position:fixed;pointer-events:none;transform-style:preserve-3d;will-change:transform}
.flip>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px}
.flip .b{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#4d3f6b,#4d3f6b 8px,#5a4a7c 8px,#5a4a7c 16px);border:2px solid #fff3;box-shadow:0 10px 24px #000a}
.flip .card{width:100%;height:100%}
.bsr{display:flex;gap:8px;width:100%;max-width:420px}
.bs{flex:1;aspect-ratio:5/7;border-radius:10px;transition:box-shadow .06s,transform .06s,opacity .35s}
.bs .card,.gd .card{width:100%;height:100%}
.bs.on{box-shadow:0 0 0 4px var(--gold),0 0 30px 10px #ffd34daa;transform:scale(1.07)}
.bs.dim{opacity:.3;transform:none;box-shadow:none}
.bs.win{animation:pulse .5s ease-in-out 2}
@keyframes pulse{50%{transform:scale(1.14)}}
.ring{position:fixed;left:50%;top:46%;width:0;height:0}
.gd{position:absolute;left:0;top:0;aspect-ratio:5/7;border-radius:10px;box-shadow:0 8px 20px #000a}
.cell.hid{visibility:hidden}
.cell.land{animation:land .7s}
@keyframes land{0%{transform:scale(1.3);box-shadow:0 0 0 0 #ffd34d}35%{box-shadow:0 0 34px 12px #ffd34d}100%{transform:none;box-shadow:0 0 0 0 #ffd34d00}}
#ov{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:9;padding:16px;overflow-y:auto}
#ov.on{display:grid}
.box{background:#2f2b37;border-radius:20px;padding:14px;width:min(100%,360px);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.box .card.big{width:min(58vw,300px);height:auto;aspect-ratio:5/7}
.box .grid{width:100%;max-height:55dvh;overflow-y:auto}
.pks>.pk{aspect-ratio:auto;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:10px}.pk .card{width:100%;aspect-ratio:5/7}.pk small{font-size:.7rem;color:var(--mute)}.pk.sel{box-shadow:0 0 0 4px var(--gold);transform:scale(1.05)}
.vst{width:100%;display:flex;flex-direction:column;gap:6px}.vst div{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#ffffff14;border-radius:12px;padding:8px 12px;text-align:left;font-size:.92rem}.vst b{color:#ffd34d;font-size:1.25rem}
.btns{display:flex;flex-direction:column;gap:8px;width:100%}
.btns button{border:0;border-radius:14px;background:#4a4555;color:var(--ink);font:700 1.05rem Fredoka,sans-serif;padding:12px}
.btns button:disabled{opacity:.35}
.btns button.verde,.btns button.rojo,.btns button.azul{color:#fff}
.btns button.fxb{display:flex;align-items:center;justify-content:center;gap:12px;text-align:left}.fth{flex:none;width:46px}.fth .card{width:100%;height:auto;aspect-ratio:5/7}
.btns .ghost{background:none;color:var(--mute);font-weight:500}
.pv{font-weight:700;color:var(--gold);font-size:1.2rem}
@keyframes bl{50%{box-shadow:0 0 0 4px var(--gold),0 0 18px var(--gold)}}
.blink{animation:bl 1s infinite}
#bt{position:fixed;inset:0;background:#1d1a24;z-index:4;display:none;flex-direction:column;gap:10px;padding:12px;max-width:520px;margin:0 auto;overflow-y:auto}
#bt.on{display:flex}
.vs{display:grid;grid-template-columns:1fr auto 1.5fr;gap:8px;align-items:center}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mute);font-size:.8rem}
.vs .cell{width:30vw;max-width:130px}
.vsx{font-size:1.8rem;color:var(--gold)}
.orb{width:84px;height:84px;border-radius:50%;background:var(--gold);color:#2b2208;display:grid;place-items:center;font:700 2.4rem Fredoka,sans-serif}
.orb.p{background:#6fb1ff}
.pl{display:flex;gap:6px;width:100%}
.pl>div{flex:1;aspect-ratio:5/7;border:2px dashed #fff3;border-radius:8px;display:grid;place-items:center;font-size:.7rem}
.dim{opacity:.45}
.row3{display:flex;gap:8px;width:100%}.b3{flex:1;aspect-ratio:5/7;transition:.4s}.b3.sel{box-shadow:0 0 0 4px var(--gold);transform:scale(1.07)}.b3 .deck{height:100%;font-size:2rem}
#apart{position:fixed;right:6px;top:64px;display:flex;flex-direction:column;gap:4px;width:9vw;max-width:48px;z-index:1}#apart>div{aspect-ratio:5/7}
.step,#tTurn{display:none!important}.bar{grid-template-columns:1fr 1fr!important}.row{justify-content:center}

.box{animation:pop .28s cubic-bezier(.2,.9,.3,1.3)}@keyframes pop{from{transform:scale(.8);opacity:0}}
.tbn{font:700 clamp(3rem,16vw,6rem) Fredoka,sans-serif;color:#fff;letter-spacing:.12em;text-shadow:0 4px 0 #0008;animation:pop .4s}
.tnum{position:relative;height:1.3em;width:3em;font:700 clamp(4rem,24vw,9rem) Fredoka,sans-serif;color:var(--gold);text-align:center;overflow:hidden;line-height:1.3}
.tnum span{position:absolute;inset:0}.tnum .o{animation:tOut .45s ease-in .9s forwards}.tnum .n{transform:translateY(100%);animation:tIn .45s ease-out .9s forwards}
@keyframes tOut{to{transform:translateY(-100%);opacity:0}}@keyframes tIn{to{transform:none}}
.stp{font:700 clamp(2.4rem,13vw,5rem) Fredoka,sans-serif;padding:.1em .45em;border:.1em solid;border-radius:.2em;transform:rotate(-8deg);background:#000a;animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both}
.stp.ok{color:#ffd34d;box-shadow:0 0 40px #ffd34d88}.stp.ko{color:#ff5a5a;box-shadow:0 0 40px #ff5a5a88}
@keyframes stamp{from{transform:rotate(-8deg) scale(3);opacity:0}60%{transform:rotate(-8deg) scale(.92)}}
.gst{position:fixed;z-index:35;pointer-events:none;aspect-ratio:5/7}.gst .card{width:100%;height:100%}
.gst.gdone{animation:gDone .9s ease-in forwards}.gst.gout{animation:gOut .7s ease-in forwards}.gst.gfly{animation:gFly .75s ease-in forwards}
@keyframes gDone{30%{transform:scale(1.15);filter:drop-shadow(0 0 22px #ffd34d)}to{transform:translateY(-30vh) scale(.4);opacity:0;filter:drop-shadow(0 0 30px #ffd34d)}}
@keyframes gOut{to{transform:scale(.6) rotate(12deg);opacity:0;filter:grayscale(1) brightness(.5)}}
@keyframes gFly{to{transform:translate(35vw,55vh) scale(.25) rotate(25deg);opacity:0}}
.pgf{position:fixed;z-index:36;pointer-events:none;font:700 2.2rem Fredoka,sans-serif;text-shadow:0 2px 0 #000,0 0 10px #000;animation:pgf 1.1s ease-out forwards;transform:translateX(-50%)}
@keyframes pgf{from{transform:translate(-50%,10px) scale(.5);opacity:0}25%{transform:translate(-50%,-10px) scale(1.3);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
.pg.bump{animation:tick .45s}
.hrt.heal{filter:drop-shadow(0 0 25px #4dff88);animation:pulse .6s infinite}
.cf{position:fixed;top:-5vh;z-index:40;pointer-events:none;animation:cf var(--d) linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(var(--r))}}
.land{animation:land .7s}

/* ---------- cinemática de batalla ---------- */
#cine{position:fixed;inset:0;z-index:40;background:#000e;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 10px 10px;overflow:hidden}
#cdice{position:relative;z-index:3;display:flex;justify-content:center;align-items:center;gap:2vw;--s:min(19vw,90px);perspective:700px;height:calc(var(--s)*1.6);width:100%;max-width:520px}
#cdice .slot{flex:none}
#cmid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;width:100%;max-width:520px}
.cs{display:flex;flex-direction:column;align-items:center;gap:10px}
.cw{position:relative;width:max(70px,min(34vw,140px,calc((100dvh - 420px)*5/7)));aspect-ratio:5/7}
.cw .card{position:absolute;inset:0;width:100%;height:100%;box-shadow:0 8px 24px #000a}
.cr{display:flex;align-items:center;gap:12px}
.co{width:66px;height:66px;border-radius:50%;background:var(--gold);color:#2b2208;display:grid;place-items:center;font:700 2rem Fredoka,sans-serif;box-shadow:0 0 18px #f2c14e99}
.co.p{background:#6fb1ff;box-shadow:0 0 18px #6fb1ff99}
.cfire{position:relative;width:11vw;max-width:50px;aspect-ratio:5/7;margin-right:22px}
.cfire>div{position:absolute;inset:0}
.cgh{position:fixed;z-index:41;pointer-events:none}
.cspk{position:fixed;z-index:42;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:radial-gradient(#fff 25%,var(--c) 62%,transparent 72%);box-shadow:0 0 14px 6px var(--c);pointer-events:none}
.cbig{position:fixed;z-index:42;pointer-events:none;line-height:1;transform:translate(-50%,-50%)}
.cas{display:flex;gap:6px;justify-content:center;min-height:calc(min(9vw,40px)*1.4)}
.cai{position:relative;width:min(9vw,40px);aspect-ratio:5/7}.cai .card{position:absolute;inset:0;width:100%;height:100%}
.foot{flex-direction:column;gap:8px}
.vol{background:#3a3644;border-radius:14px;padding:10px 14px;width:100%;display:flex;align-items:center;gap:10px}
.vol label{font:700 1rem Fredoka,sans-serif;color:var(--ink);white-space:nowrap;min-width:2ch;text-align:center}
.vol input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(to right,var(--gold) calc(var(--pct,100%)),#5a5168 calc(var(--pct,100%)));outline:none;cursor:pointer}
.vol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);box-shadow:0 2px 6px #0008;cursor:pointer}
.vol input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--gold);border:none;box-shadow:0 2px 6px #0008;cursor:pointer}
@media (prefers-reduced-motion:reduce){*:not(.blink),*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== LOBBY ===== */
#lobby{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px)+20px) 16px calc(env(safe-area-inset-bottom,0px)+16px);overflow-y:auto;background:radial-gradient(120% 80% at 50% 30%,#3a2a55,#1a1520)}
#lobby.oculto{display:none}
.lob-title{font:700 clamp(2rem,10vw,3.2rem) Fredoka,sans-serif;color:var(--gold);letter-spacing:.1em;text-align:center;text-shadow:0 4px 0 #0008;margin-bottom:4px;animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
.lob-sub{color:var(--mute);font-size:.95rem;text-align:center;margin-bottom:20px}
.lob-chars{display:flex;gap:14px;justify-content:center;width:100%;max-width:420px;margin-bottom:20px}
.lob-char{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;border-radius:18px;padding:10px;background:#ffffff08;border:3px solid transparent;transition:border-color .18s,transform .18s,background .18s}
.lob-char:active{transform:scale(.96)}
.lob-char.sel{border-color:var(--gold);background:#ffd34d18;transform:scale(1.04)}
.lob-char .card-wrap{width:100%;aspect-ratio:5/7;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px #0009}
.lob-char .card-wrap .card{width:100%;height:100%}
.lob-char .char-name{font:700 1rem Fredoka,sans-serif;color:var(--ink);text-align:center}
.lob-char.sel .char-name{color:var(--gold)}
.lob-start{border:0;border-radius:18px;background:var(--gold);color:#2b2208;font:700 1.3rem Fredoka,sans-serif;padding:16px;width:100%;max-width:420px;cursor:pointer;transition:transform .1s,filter .1s;box-shadow:0 8px 24px #ffd34d44}
.lob-start:active{transform:scale(.97)}
.lob-start:disabled{opacity:.4;filter:grayscale(.5)}
.lob-resume{border:0;border-radius:18px;background:#4a4555;color:var(--ink);font:700 1.1rem Fredoka,sans-serif;padding:14px;width:100%;max-width:420px;cursor:pointer;margin-top:8px;transition:transform .1s}
.lob-resume:active{transform:scale(.97)}
.lob-sep{color:var(--mute);font-size:.8rem;margin:6px 0;text-align:center}
</style>
</head>
<body>
<!-- LOBBY -->
<div id="lobby" class="oculto">
  <div class="lob-title">⚔️ Link Master</div>
  <div class="lob-sub">Dungeon Edition · Elige tu personaje</div>
  <div class="lob-chars">
    <div class="lob-char" id="lob-p1" data-char="m">
      <div class="card-wrap"><div class="card" data-id="m19"><img src="personajes/personaje 1/m19.png" alt="Personaje 1" onerror="this.remove()"></div></div>
      <div class="char-name">Personaje 1</div>
    </div>
    <div class="lob-char" id="lob-p2" data-char="l">
      <div class="card-wrap"><div class="card" data-id="l19"><img src="personajes/personaje 2/l19.png" alt="Personaje 2" onerror="this.remove()"></div></div>
      <div class="char-name">Personaje 2</div>
    </div>
  </div>
  <button class="lob-start" id="lob-btn-start" disabled>Entrar al calabozo →</button>
  <div class="lob-sep" id="lob-sep-resume" style="display:none">── o ──</div>
  <button class="lob-resume" id="lob-btn-resume" style="display:none">▶ Continuar partida guardada</button>
</div>

<div class="app">
  <div class="bar"><button class="tab" id="tTurn">Turno</button><button class="tab" data-sh="hand" id="tHand">Mano</button><button class="tab" data-sh="st" id="tSt">Estado</button></div>
  <div id="cross"></div>
  <div><span class="lbl">En mesa</span><div class="strip" id="mesa"></div></div>
  <div class="decks">
    <div data-pj="m19" id="m19"></div><div data-hab="1" id="m20"></div>
    <div class="deck" data-dk="M" id="dM"></div><div class="deck" data-dk="K" id="dK"></div><div class="deck" data-dk="C" id="dC"></div>
  </div>
</div>

<div class="sheet" id="sh-hand"><h3>Mano</h3><div class="grid" id="hand"></div></div>

<div class="sheet" id="sh-st">
  <h3>Estado del jugador</h3>
  <div class="top">
    <div class="panel"><small>Turno</small><div class="row"><button class="step" data-k="turn" data-d="-1" aria-label="Turno menos">−</button><span class="num" id="turn">1</span><button class="step" data-k="turn" data-d="1" aria-label="Turno más">+</button></div></div>
    <div class="panel"><small>Corazones</small><div class="row"><button class="step" data-k="hp" data-d="-1" aria-label="Corazón menos">−</button><span class="num"><span class="heart">♥</span><span id="hp">10</span></span><button class="step" data-k="hp" data-d="1" aria-label="Corazón más">+</button></div></div>
  </div>
  <div class="piles">
    <div data-pile="disc">Descartes calabozo<div class="deck" id="pDisc"></div></div>
    <div data-pile="comp">Completados<div id="pComp"></div></div>
    <div data-pile="dm">Descartes personaje<div id="pDm"></div><div class="fire" id="pFire"></div></div>
  </div>
  <div class="foot">
    <div class="vol"><span id="volIcon">🔊</span><input type="range" id="snd" min="0" max="10" step="1" value="10"><label id="volNum">10</label></div>
    <div class="vol"><span id="musIcon">🎵</span><input type="range" id="mus" min="0" max="10" step="1" value="5"><label id="musNum">5</label></div>
    <button id="reset">Reiniciar toda la partida</button>
    <button id="install">📲 Instalar juego</button>
  </div>
</div>
<div id="apart"></div>
<div id="bt"></div>
<div id="ov"></div>

<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;let SND=10,AC=null;try{const sv=localStorage.getItem('mesa-snd');SND=sv===null?10:+sv}catch(e){}
const ac=()=>AC=AC||new(window.AudioContext||window.webkitAudioContext)();
const vib=p=>{if(SND>0&&!RM)try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
let SK=1;const VOL=()=>SND/10,SGAIN=2; /* ganancia general de efectos (x2) */
const tone=(f,d,type='sine',v=.15,t0=0,f2=0)=>{if(!SND)return;try{const A=ac();if(A.state==='suspended')A.resume();const t=A.currentTime+t0,o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v*VOL()*SGAIN*SK,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(A.destination);o.start(t);o.stop(t+d)}catch(e){}};
const noiz=(d,v=.3)=>{if(!SND)return;try{const A=ac(),n=Math.floor(A.sampleRate*d),b=A.createBuffer(1,n,A.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=A.createBufferSource(),g=A.createGain(),f=A.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;g.gain.value=v*VOL()*SGAIN*SK;s.buffer=b;s.connect(f);f.connect(g);g.connect(A.destination);s.start()}catch(e){}};
const SFX={
  tick:()=>tone(1000,.05,'square',.04),
  pop:()=>tone(520,.12,'triangle',.12,0,900),
  charge:()=>tone(180,.55,'sawtooth',.08,0,700),
  hit:()=>{tone(120,.35,'sawtooth',.25,0,40);noiz(.25,.3)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.4,'triangle',.14,i*.09)),
  fail:()=>{tone(300,.35,'square',.1,0,120);tone(1400,.12,'square',.05)},
  /* nuevos */
  draw:()=>tone(680,.09,'triangle',.09,0,1100),                          /* robar carta: breve tono ascendente */
  swoosh:()=>{tone(900,.18,'sine',.07,0,220);noiz(.12,.08)},             /* carta vuela a la mano */
  place:()=>tone(340,.08,'triangle',.1,0,480),                           /* carta aterriza en la cruz */
  shuffle:()=>{noiz(.09,.18);tone(260,.07,'square',.04,.04)},            /* un "clic" de barajar (se llama varias veces) */
  fire:()=>{tone(200,.22,'sawtooth',.1,0,600);noiz(.15,.12)},            /* carta de fuego vuela */
  heal:()=>tone(660,.18,'triangle',.1,0,880),                            /* latido de curación (por tick) */
  boss:()=>{tone(55,.9,'sawtooth',.22,0,110);noiz(.6,.18)},              /* jefe final aparece */
  thud:()=>{tone(80,.14,'sine',.18,0,60);noiz(.12,.22)},                 /* guardián aterriza */
  bell:()=>[880,1108].forEach((f,i)=>tone(f,.35,'sine',.09,i*.06)),      /* campana de turno nuevo */
  fanfare:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.55,'triangle',.18,i*.07)), /* victoria final */
  slash:()=>{noiz(.08,.35);tone(420,.12,'sawtooth',.12,0,80)},           /* corte de victoria en batalla */
  tap:()=>{tone(700,.06,'triangle',.225,0,420);tone(1400,.03,'sine',.1)},                           /* toque en pantalla */
};
/* nivelación: ganancia por efecto para que todos suenen parejo (medido con ponderación A) */
{const SFXG={tick:3.7,pop:2.1,charge:2.5,draw:2.7,swoosh:1.8,place:4.3,shuffle:2.3,fire:1.9,heal:1.8,boss:1.3,thud:1.9};
 Object.keys(SFXG).forEach(k=>{const f=SFX[k];SFX[k]=(...a)=>{SK=SFXG[k];try{return f(...a)}finally{SK=1}}})}
/* sonido de toque: cada vez que el jugador toca la pantalla (respeta el volumen de sonido) */
{let lastTap=0;document.addEventListener('pointerdown',()=>{const n=performance.now();if(n-lastTap<40)return;lastTap=n;SFX.tap()},{capture:true,passive:true})}
const rng=(p,a,b)=>Array.from({length:b-a+1},(_,i)=>p+pad(a+i));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* ruta de imagen según el prefijo: m→personaje 1, l→personaje 2, resto→cartas/ */
const imgSrc=id=>id[0]==='m'?`personajes/personaje 1/${id}.png`:id[0]==='l'?`personajes/personaje 2/${id}.png`:`cartas/${id}.png`;
const card=(id,c='')=>`<div class="card ${c}" data-id="${id}"><img src="${imgSrc(id)}" alt="${id}" onerror="this.remove()"></div>`;
/* personaje activo: 'm' = personaje 1 (cartas m), 'l' = personaje 2 (cartas l) */
let CHAR='m'; /* se elige en el lobby antes de startGame */
const charCard19=()=>CHAR==='l'?'l19':'m19';
const charCard20=()=>CHAR==='l'?'l20':'m20';
const charPrefix=()=>CHAR;
const PC=()=>S.personaje||'m';
const fresh0=()=>({turn:1,hp:10,personaje:CHAR,dM:shuf(rng(CHAR,1,18)),dK:shuf(rng('k',1,6)),dC:shuf(rng('c',1,57)),hand:[],mesa:[],disc:[],comp:[],cross:[{id:'j01',p:10},null,null,null,null],final:0,hab:0,apart:[],vk:0,nc:0});
const fresh=()=>{const s=fresh0();s.hand=s.dM.splice(-8);for(let k=0;k<3;k++)s.disc.push(s.dC.pop());for(let i=1;i<=4;i++){s.cross[i]={id:s.dC.pop(),p:0};if(/^c4[0-8]$/.test(s.cross[i].id))s.cross[0].p=Math.max(0,s.cross[0].p-1)}return s};
let S=fresh(),NEWG=1;
try{const v=JSON.parse(localStorage.getItem('mesa-juego')||'null');if(v&&v.cross){S=v;CHAR=v.personaje||'m';NEWG=0}}catch(e){}
if(S.over){S=fresh();NEWG=1}

let ENDQ=0;const lost=()=>S.hp<=0||(S.cross[0]&&S.cross[0].id==='j01'&&S.cross[0].p<=0);
/* ---------- pintar ---------- */
function dedupeM(){const v=new Set();const pfx=S.personaje||'m';[S.hand,S.disc,S.dM].forEach(a=>{for(let i=a.length-1;i>=0;i--){const x=a[i];if(x[0]!==pfx)continue;if(v.has(x))a.splice(i,1);else v.add(x)}})}
function render(){
  dedupeM();
  S.apart=S.apart||[];$('#apart').innerHTML=S.apart.map(id=>`<div data-ap="${id}">${card(id)}</div>`).join('');
  checkEnd();
  if(!S.over&&!ENDQ&&lost()){ENDQ=1;whenFree(()=>{ENDQ=0;if(!S.over&&lost())endGame()})}
  $('#cross').innerHTML=[null,1,null,2,0,3,null,4,null].map(i=>{
    if(i===null)return'<div></div>';const c=S.cross[i];
    return c?`<div class="cell${PICK&&(i||S.final&&unl().length)&&CH[c.id]&&!blk(c)?' blink':''}${HIDE.has(i)?' hid':''}" data-s="${i}">${card(c.id)}<b class="pg">${c.p}</b></div>`:PEND[i]?`<div class="cell">${PEND[i].h}<b class="pg">${PEND[i].p}</b></div>`:'<div class="cell empty"></div>'}).join('');
  $('#mesa').innerHTML=S.mesa.map((id,i)=>`<div data-m="${i}">${card(id)}</div>`).join('');
  {const pfxH=S.personaje||'m';$('#hand').innerHTML=S.hand.length?S.hand.map((id,i)=>`<div data-h="${i}"${(pfxH==='l'?id==='l17':id==='m08'||id==='m14')?' class="blink"':''}>${card(id)}</div>`).join(''):'';
  if(!S.hand.length)$('#hand').innerHTML='<div class="empt" style="grid-column:1/-1;aspect-ratio:auto">Sin cartas en la mano</div>';
  $('#tHand').textContent='Mano ('+S.hand.length+')';$('#tHand').classList.toggle('blink',S.hand.some(x=>x===pfxH+'08'||x===pfxH+'14'));}
  {const p=S.personaje||'m';$('#m19').innerHTML=card(p+'19');$('#m19').dataset.pj=p+'19';$('#m20').innerHTML=card(p+'20',S.hab?'':'off');$('#m20').dataset.hab=1;}
  $('#dM').innerHTML=`<span>Personaje<b>${S.dM.length}</b></span>`;
  $('#dK').innerHTML=`<span>Agotamiento<b>${S.dK.length}</b></span>`;$('#dK').classList.toggle('blink',!!(PICK&&!S.hand.length&&S.dK.length));
  $('#dC').innerHTML=`<span>Calabozo<b>${S.dC.length}</b></span>`;
  $('#pDisc').innerHTML=`<span><b>${S.disc.filter(x=>x[0]==='c').length}</b></span>`;
  {const pfxR=S.personaje||'m';const dm=S.disc.filter(x=>x[0]===pfxR);$('#pDm').innerHTML=(dm.length?card(dm[dm.length-1]):'<div class="card" style="opacity:.4"></div>')+`<span class="cn">${dm.length}</span>`;$('#pFire').textContent=(S.personaje==='l'?'⚔️ ':'🔥 ')+fireDisc()}
  $('#pComp').innerHTML=S.comp.length?card(S.comp[S.comp.length-1]):'<div class="card" style="opacity:.4"></div>';
  $('#turn').textContent=S.turn;$('#hp').textContent=S.hp;
  if(!SL)try{localStorage.setItem('mesa-juego',JSON.stringify(S))}catch(e){}
  try{fxDiff()}catch(e){}
}

/* ---------- animaciones ---------- */
let SL=0,INTRO=0,FXR=0,HIDE=new Set();const FXQ=[],wait=ms=>new Promise(r=>setTimeout(r,ms)),FXL=document.body.appendChild(Object.assign(document.createElement('div'),{id:'fxl'}));
function fxPlay(job){FXQ.push(job);if(FXR)return;FXR=1;FXL.classList.add('on');(async()=>{while(FXQ.length){try{await FXQ.shift()(FXL)}catch(e){}if(!FXQ.length){FXL.classList.add('fo');await wait(250)}}FXL.classList.remove('on','fo','clear');FXL.innerHTML='';FXR=0})()}

/* ---------- animaciones extra ---------- */
const PEND={};
let PV=[],PHP=null,PM=null,PT=null,NOFX=0,BR=0,TP=null,IDLE=0;const BQ=[];
/* Fase de tablero: todo lo que se anima en el tablero espera a que se cierren la pantalla de
   efectos (#ov), la batalla (#bt) y los efectos a pantalla completa (FXR). Entonces se reproduce
   UNA A UNA (cola BQ), luego se rellena la cruz (autoFill) y SOLO AL FINAL empieza el turno. */
let PH=0;
const closeSheets=()=>{['hand','st'].forEach(n=>$('#sh-'+n).classList.remove('on'));['tHand','tSt'].forEach(n=>$('#'+n).classList.remove('on'))};
const boardBusy=()=>BR||FXR||SFB||(typeof AFB!=='undefined'&&AFB)||$('#ov').classList.contains('on')||$('#bt').classList.contains('on');
setInterval(async()=>{
  IDLE=boardBusy()?0:IDLE+1;if(IDLE<2)return;
  if(INTRO&&!BQ.length&&TP===null&&!S.over&&[1,2,3,4].every(k=>S.cross[k])){INTRO=0;PH=0;fxTurn(0);return}
  if(!BQ.length&&TP===null){PH=0;return}
  if(!PH){PH=1;closeSheets()}
  if(BQ.length){BR=1;try{await BQ.shift()()}catch(e){}BR=0;IDLE=1;return}
  if(TP!==null){if(S.over||S.hp<=0){TP=null;PH=0;return}if([1,2,3,4].some(k=>!S.cross[k]))return;TP=null;PH=0;const a=S.turn;S.turn++;PICK=1;render();fxTurn(a)}
},200);
const CPOS=[null,1,null,2,0,3,null,4,null];
const fxStamp=(t,k)=>fxPlay(async L=>{k==='ok'?SFX.win():SFX.fail();vib(k==='ok'?[40,40,80]:60);L.classList.add('clear');L.innerHTML=`<div class="stp ${k}">${t}</div>`;await wait(1300)});
const fxTurn=a=>fxPlay(async L=>{L.innerHTML=a?`<div class="tbn">TURNO</div><div class="tnum"><span class="o">${a}</span><span class="n">${a+1}</span></div>`:`<div class="tbn">TURNO</div><div class="tnum"><span class="n" style="transform:none;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both">1</span></div>`;SFX.bell();vib([20,30,20]);await wait(a?1800:1500)});
const fxHeal=(a,b)=>fxPlay(async L=>{L.innerHTML=`<div class="fxt">¡Recuperas salud!</div><div class="hw"><div class="hrt heal"><span>💚</span><b>${a}</b></div></div>`;const N=L.querySelector('b');await wait(700);for(let v=a+1;v<=b;v++){N.textContent=v;N.classList.remove('tick');void N.offsetWidth;N.classList.add('tick');SFX.heal();vib(15);await wait(420)}await wait(700)});
function confetti(){SFX.fanfare();vib([30,40,80,40,30]);for(let i=0;i<60;i++){const e=document.createElement('i');e.className='cf';e.textContent=['🎉','✨','⭐','🟡','🔴','🔵'][i%6];e.style.cssText=`left:${Math.random()*100}vw;font-size:${14+Math.random()*16}px;--d:${2+Math.random()*2}s;--r:${Math.random()*720}deg;animation-delay:${Math.random()*.8}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}
function ghost(r,h,cls,ms){if(!r||!r.width)return;const g=document.createElement('div');g.className='gst '+cls;g.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;g.innerHTML=h;document.body.appendChild(g);setTimeout(()=>g.remove(),ms);return g}
function fxDiff(){
  const ch=[...$('#cross').children],nv=[];
  CPOS.forEach((i,j)=>{if(i===null)return;const c=S.cross[i],el=ch[j];nv[i]=c&&el&&el.firstElementChild?{id:c.id,p:c.p,r:el.getBoundingClientRect(),h:el.firstElementChild.outerHTML,el}:null});
  if(PT!==null&&S.turn<PT){PV=[];PHP=null;PM=null}
  if(!NOFX)for(let i=0;i<5;i++){const o=PV[i],n=nv[i];
    if(o&&n&&o.id===n.id&&o.p!==n.p&&n.r.width){const d=n.p-o.p,j=CPOS.indexOf(i),op=o.p,np=n.p;BQ.push(async()=>{const el=$('#cross').children[j];if(!el)return;const pg=el.querySelector('.pg');if(pg)pg.textContent=op;await wait(250);const r=el.getBoundingClientRect(),f=document.createElement('b');f.className='pgf';f.textContent=(d>0?'+':'')+d;f.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/3}px;color:${d>0?'#ffd34d':'#7dffb0'}`;document.body.appendChild(f);setTimeout(()=>f.remove(),1200);if(pg){pg.textContent=np;pg.classList.remove('bump');void pg.offsetWidth;pg.classList.add('bump')}await wait(900)})}
    else if(o&&i&&(!n||n.id!==o.id)&&S.cross.length){const k=S.comp[S.comp.length-1]===o.id?'gdone':'gout',j=CPOS.indexOf(i);if(!n){PEND[i]={h:o.h,p:o.p};const ce=ch[j];if(ce){ce.className='cell';ce.innerHTML=o.h+'<b class="pg">'+o.p+'</b>'}}BQ.push(async()=>{const e=$('#cross').children[j],r=e?e.getBoundingClientRect():null;if(PEND[i]){delete PEND[i];if(e&&!S.cross[i]){e.className='cell empty';e.innerHTML=''}}ghost(r&&r.width?r:o.r,o.h,k,950);await wait(1000)})}}
  if(!NOFX&&PHP!==null&&S.hp>PHP&&S.turn>=PT&&!S.over)fxHeal(PHP,S.hp);
  if(!NOFX&&PM!==null&&S.mesa.length===PM+1){const ix=S.mesa.length-1;BQ.push(async()=>{const m=$('#mesa').children[ix];if(m){m.classList.add('land');await wait(750)}})}
  PV=nv;PHP=S.hp;PM=S.mesa.length;PT=S.turn}
const jDraw=(ids,toHand)=>async L=>{
  /* cualquier robo: las cartas entran una por una (pequeñas, en cuadrícula), se quedan un momento, se juntan y vuelan juntas a la mano */
  const n=ids.length,cols=Math.min(n,3),rows=Math.ceil(n/3),cw=Math.max(40,Math.floor(Math.min((Math.min(innerWidth-32,420)-16)/3,((innerHeight-170-(rows-1)*8)/rows)/1.4)));
  L.innerHTML=`<div class="fxt">${n===1?'Robas una carta':`Robas ${n} cartas`}</div><div class="grid fxg" style="grid-template-columns:repeat(${cols},1fr);width:${cols*cw+(cols-1)*8}px;max-width:100%">${ids.map((id,i)=>`<div class="fxc fin" style="animation-delay:${i*260}ms">${card(id)}</div>`).join('')}</div>`;
  ids.forEach((_,i)=>setTimeout(()=>SFX.draw(),500+i*260));
  await wait(500+(n-1)*260+1500);
  await gatherToHand(L)
};
const fxDraw=ids=>fxPlay(jDraw(ids));
async function gatherToHand(L){const g=L.querySelector('.fxg'),h=$('#tHand'),t=L.querySelector('.fxt');if(!g)return;
  const q=g.getBoundingClientRect(),cx=q.left+q.width/2,cy=q.top+q.height/2;
  if(t)t.animate([{opacity:1},{opacity:0}],{duration:400,fill:'forwards'});
  await Promise.all([...g.children].map((c,i)=>{const r=c.getBoundingClientRect();c.style.zIndex=i;
    return c.animate([{transform:'none'},{transform:`translate(${cx-(r.left+r.width/2)}px,${cy-(r.top+r.height/2)}px) rotate(${(i%2?1:-1)*(2+i%3*2)}deg) scale(.9)`}],{duration:600,delay:i*30,easing:'cubic-bezier(.5,0,.3,1)',fill:'forwards'}).finished}));
  await wait(150);
  if(!h)return;const r=h.getBoundingClientRect();
  SFX.swoosh();
  await g.animate([{transform:'none',opacity:1},{transform:`translate(${r.left+r.width/2-cx}px,${r.top+r.height/2-cy}px) scale(.08)`,opacity:0}],{duration:700,easing:'cubic-bezier(.5,0,.8,.4)',fill:'forwards'}).finished;
  h.classList.remove('bump');void h.offsetWidth;h.classList.add('bump');setTimeout(()=>h.classList.remove('bump'),500)}
const jDd=(n,t)=>async L=>{let c=t;
  L.innerHTML=`<div class="fxt">Descartas del mazo de calabozo</div><div class="stk"><em class="bk base"></em></div><div class="cnt">${c}</div>`;
  const st=L.querySelector('.stk'),ct=L.querySelector('.cnt');await wait(500);

      rolls=1;if(await l11())skips++;else await tally();

    /* golpe */

    let back=null;

      popV(Lo,Math.max(0,falta-tot))}
    slash(cx,cy,px*1.5,win?'#ffd34d':'#8ec5ff');if(win)slash(cx,cy,px*1.5,'#ffd34d',1,140);
    if(win)SFX.slash();
    await wait(260);
    impact(cx,cy,win?'#ffd34d':'#8ec5ff',win?24:10);SFX.hit();vib(win?[30,40,60]:20);
    await wait(90);
    Lc.animate([{transform:'none'},{transform:'translateX(-9px)'},{transform:'translateX(9px)'},{transform:'translateX(-5px)'},{transform:'none'}],{duration:320});
    if(win){
      const ZP=[[52,0],[48,14],[54,28],[47,42],[53,57],[48,71],[54,85],[50,100]],pt=ZP.map(q=>q[0]+'% '+q[1]+'%').join(',');
      const cr=document.createElement('div');cr.className='cgh';cr.style.cssText=`left:${lr.left}px;top:${lr.top}px;width:${lr.width}px;height:${lr.height}px`;

/* ---------- relleno automático de desafíos ---------- */
let AFB=0;
async function autoFill(){
  if(AFB||BR||BQ.length||S.over||S.hp<=0||FXR||$('#ov').classList.contains('on')||$('#bt').classList.contains('on')||document.querySelector('.sheet.on'))return;
  /* red de seguridad: cualquier desafío con progreso suficiente se completa cuando el tablero está libre, sin importar cómo llegó ahí el progreso */
  if([1,2,3,4].some(k=>{const x=S.cross[k],lv=sweepLV(x);return lv!==null&&x.p>=lv})){AFB=1;sweep(()=>{AFB=0});return}
  /* jefe final: si ya tiene el progreso necesario y nada lo bloquea (g01 en la cruz), se gana sin tener que volver a intentarlo */
  {const bj=S.cross[0];if(S.final&&bj&&/^j0[2-4]$/.test(bj.id)&&bj.p>=LV(bj)&&!S.cross.some(x=>x&&x.id==='g01')){showVictory('El jefe final ya tenía el progreso necesario.');return}}
  if(S.final)return;
  const i=[1,2,3,4].find(k=>!S.cross[k]);if(!i)return;
  if(!S.dC.length){startFinal();return}
  AFB=1;const d=S.dC[S.dC.length-1],blk=document.createElement('div');
  try{
    const cell=$('#cross').children[[null,1,null,2,0,3,null,4,null].indexOf(i)],dk=$('#dC');
    if(cell&&dk){
      const A=dk.getBoundingClientRect(),C=cell.getBoundingClientRect();
      const dx=A.left+A.width/2-(C.left+C.width/2),dy=A.top+A.height/2-(C.top+C.height/2),sx=A.width/C.width,sy=A.height/C.height,P='perspective(900px) ';
      blk.className='fblk';blk.innerHTML=`<div class="flip" style="left:${C.left}px;top:${C.top}px;width:${C.width}px;height:${C.height}px"><div class="b"></div><div class="a">${card(d)}</div></div>`;
      document.body.appendChild(blk);
      const n=dk.querySelector('b');if(n)n.textContent=S.dC.length-1;
      await blk.firstChild.animate([
        {transform:`${P}translate(${dx}px,${dy}px) scale(${sx},${sy}) rotateY(180deg)`},
        {transform:`${P}translate(${dx*.45}px,${dy*.45-40}px) scale(${(1+sx)/2*1.15},${(1+sy)/2*1.15}) rotateY(110deg)`,offset:.5},
        {transform:`${P}translate(0,0) scale(1,1) rotateY(0deg)`}
      ],{duration:1000,easing:'cubic-bezier(.3,.7,.3,1)',fill:'forwards'}).finished;
    }
  }catch(e){}
  const id=S.dC.pop();S.cross[i]={id,p:S.apart.includes('c53')&&TY[id]&&TY[id]!=='C'?2:0};entry(i);checkEnd();render();SFX.place();vib(10);
  blk.remove();AFB=0;setTimeout(autoFill,150)
}
setInterval(autoFill,400);

/* ---------- iniciar partida ---------- */

  closeSheets();close();
  /* CHAR ya fue fijado por el lobby antes de llamar a startGame */
  S=fresh0();BQ.length=0;for(const k in PEND)delete PEND[k];FXQ.length=0;TP=null;PV=[];PHP=null;PM=null;PT=null;PICK=1;B=null;PH=0;ENDQ=0;SHF=0;M18=0;HIDE.clear();
  $('#bt').classList.remove('on');$('#sh-st').classList.remove('on');$('#tTurn').textContent='Turno';hits.textContent='';
  SL=1;INTRO=1;render();
  fxPlay(async L=>{try{
    await jShuf('m',1)(L);                                   /* 1) barajar mazo de personaje */
    const h=S.dM.splice(-8);S.hand=h;render();await jDraw(h,1)(L);   /* 2) 8 cartas a la mano */
    await jShuf('k',1)(L);await jShuf('c',1)(L);                                   /* 3) barajar mazo de calabozo */
    const t=S.dC.length;for(let k=0;k<3;k++)S.disc.push(S.dC.pop());SL=0;render();await jDd(3,t)(L);  /* 4) descartar 3 */
  }catch(e){}finally{SL=0;render()}});                       /* 5) autoFill pone 4 desafíos en la cruz y luego sale TURNO 1 */
}

rs.onclick=()=>{if(!armed){armed=1;rs.textContent='Toca otra vez para borrar todo';setTimeout(()=>{armed=0;rs.textContent='Reiniciar toda la partida'},2500)}else{armed=0;rs.textContent='Reiniciar toda la partida';try{localStorage.removeItem('mesa-juego')}catch(e){}NEWG=1;showLobby()}};
{const sn=$('#snd'),ic=$('#volIcon'),nm=$('#volNum');

/* ===== LOBBY ===== */
function showLobby(){
  const lob=$('#lobby');
  lob.classList.remove('oculto');
  /* ocultar la app mientras está el lobby */
  document.querySelector('.app').style.display='none';
  /* mostrar botón de continuar solo si hay partida guardada */
  const hasSave=!NEWG&&!S.over;
  $('#lob-sep-resume').style.display=hasSave?'':'none';
  $('#lob-btn-resume').style.display=hasSave?'':'none';
  /* marcar el personaje de la partida guardada si hay una */
  if(hasSave){
    const saved=S.personaje||'m';
    document.querySelectorAll('.lob-char').forEach(el=>el.classList.toggle('sel',el.dataset.char===saved));
    $('#lob-btn-start').disabled=false;
    CHAR=saved;
  }
}
function hideLobby(){
  $('#lobby').classList.add('oculto');
  document.querySelector('.app').style.display='';
}
/* selección de personaje */
document.querySelectorAll('.lob-char').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.lob-char').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
    CHAR=el.dataset.char;
    $('#lob-btn-start').disabled=false;
  });
});
$('#lob-btn-start').addEventListener('click',()=>{
  hideLobby();
  startGame();
});
$('#lob-btn-resume').addEventListener('click',()=>{
  hideLobby();
  CHAR=S.personaje||'m';
  render();
});

/* ---------- PWA: instalación ---------- */
let _installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  _installPrompt=e;
  $('#install').classList.add('on');
});
$('#install').onclick=async()=>{
  if(!_installPrompt)return;
  _installPrompt.prompt();
  const{outcome}=await _installPrompt.userChoice;
  if(outcome==='accepted')$('#install').classList.remove('on');
  _installPrompt=null;
};
window.addEventListener('appinstalled',()=>$('#install').classList.remove('on'));
if('serviceWorker' in navigator){
  let recargado=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(recargado)return;recargado=true;location.reload()});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    r.update();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update()});
    setInterval(()=>r.update(),60000);
  });
}
